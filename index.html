<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bachcha ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #c471ed);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .card {
            width: 90%;
            max-width: 550px;
            padding: 45px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .heart {
            font-size: 75px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        h1 {
            font-size: 45px;
            margin: 15px 0;
        }

        p {
            font-size: 19px;
            line-height: 1.7;
        }

        button {
            margin-top: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff4f81;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        #message {
            display: none;
            margin-top: 25px;
            font-size: 21px;
            font-weight: bold;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: float 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Hey Bachcha 🥺❤️</h1>

        <p>
            Tum meri life ka woh beautiful part ho
            jiske bina sab kuch thoda incomplete sa lagta hai. ❤️
        </p>

        <p>
            Thank you meri life mein hone ke liye. 🫶
        </p>

        <button onclick="showLove()">
            Click Karo Bachcha 💌
        </button>

        <div id="message">
            I Love You Bachcha ❤️🥺<br>
            Hamesha mere saath rehna. 🫶
        </div>

    </div>

    <script>
        function showLove() {
            document.getElementById("message").style.display = "block";

            for (let i = 0; i < 20; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement("div");

            heart.innerHTML = "❤️";
            heart.className = "floating-heart";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (3 + Math.random() * 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }
    </script>

</body>
</html>
